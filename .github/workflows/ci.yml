name: CI

 on:
  push:
    branches: [ main, improvements/restore-tests-ci ]
  pull_request:
    branches: [ main ]

 jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies (safe)
        run: npm ci --legacy-peer-deps --omit=optional

      - name: Install Vitest for CI only
        run: npm install --no-save -D vitest@latest --legacy-peer-deps

      - name: Run tests
        run: npx vitest --run